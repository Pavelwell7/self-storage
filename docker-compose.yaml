version: '3.8'

services:
  db:
    image: postgres:14
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=120800
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
  web:
    build: .
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
#      - bundles_volume:/app/bundles_dist
    ports:
      - "8000:8000"
    env_file:
      - .env

    environment:
      - DB_URL=postgres://postgres:120800@db:5432/postgres
      - DJANGO_SETTINGS_MODULE=self_storage.settings
    depends_on:
      db:
        condition: service_started
#      frontend:
#        condition: service_completed_successfully
#  frontend:
#    build: ./bundles-src
#    volumes:
#      - bundles_volume:/app/dist
  nginx:
    image: nginx:latest
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf 
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
    depends_on:
      - web
volumes:
  postgres_data:
  static_volume:
  media_volume:
#  bundles_volume:
